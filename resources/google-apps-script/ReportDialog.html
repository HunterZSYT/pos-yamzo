<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #17352b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7f5; }
      .shell { min-height: 100vh; padding: 26px; }
      .card { background: #fff; border: 1px solid #dbe5df; border-radius: 20px; padding: 24px; box-shadow: 0 18px 45px rgba(18,55,42,.10); }
      .eyebrow { margin: 0 0 7px; color: #b7791f; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
      .sub { margin: 8px 0 20px; color: #607269; font-size: 13px; line-height: 1.5; }
      .presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .preset { border: 1px solid #d5e0da; border-radius: 12px; padding: 11px 12px; background: #fff; color: #23463a; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: .15s ease; }
      .preset:hover { border-color: #1f6d50; transform: translateY(-1px); }
      .preset.active { border-color: #1c6b4d; background: #eaf4ef; box-shadow: inset 0 0 0 1px #1c6b4d; }
      .custom { display: none; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 14px; padding: 14px; border-radius: 13px; background: #f3f7f4; }
      .custom.visible { display: grid; }
      label { display: grid; gap: 6px; color: #53675d; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
      input { width: 100%; border: 1px solid #cbd8d0; border-radius: 9px; padding: 10px; color: #17352b; background: #fff; font: inherit; }
      .notice { margin: 17px 0; padding: 12px 14px; border-radius: 11px; background: #fff8e9; color: #765418; font-size: 12px; line-height: 1.45; }
      .actions { display: flex; gap: 10px; }
      button.primary, button.secondary { min-height: 43px; border-radius: 11px; padding: 0 17px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
      button.primary { flex: 1; border: 0; background: #12372a; color: #fff; }
      button.primary:hover { background: #1a4c3a; }
      button.secondary { border: 1px solid #d3ded8; background: #fff; color: #365247; }
      button:disabled { cursor: wait; opacity: .62; }
      .status { min-height: 20px; margin: 12px 0 0; color: #607269; font-size: 12px; text-align: center; }
      .status.error { color: #a2382d; }
      .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 7px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">Yamzo analytics</p>
        <h1>Download detailed report</h1>
        <p class="sub">Choose a business-date range. Your PDF includes sales totals, sources, payments, item performance, order detail, and tracked costs.</p>
        <div class="presets" id="presets">
          <button class="preset active" data-preset="today">Today</button>
          <button class="preset" data-preset="yesterday">Yesterday</button>
          <button class="preset" data-preset="7days">Last 7 days</button>
          <button class="preset" data-preset="30days">Last 30 days</button>
          <button class="preset" data-preset="custom">Custom range</button>
        </div>
        <div class="custom" id="customRange">
          <label>Start date<input type="date" id="startDate"></label>
          <label>End date<input type="date" id="endDate"></label>
        </div>
        <div class="notice">Reports use the POS export as the source of truth. Editing this spreadsheet does not change POS records.</div>
        <div class="actions">
          <button class="secondary" id="cancel">Cancel</button>
          <button class="primary" id="download">Generate &amp; download PDF</button>
        </div>
        <p class="status" id="status"></p>
      </section>
    </main>
    <script>
      let preset = 'today';
      const status = document.getElementById('status');
      const downloadButton = document.getElementById('download');
      const customRange = document.getElementById('customRange');
      document.getElementById('presets').addEventListener('click', function (event) {
        const button = event.target.closest('[data-preset]');
        if (!button) return;
        preset = button.dataset.preset;
        document.querySelectorAll('[data-preset]').forEach(function (node) { node.classList.toggle('active', node === button); });
        customRange.classList.toggle('visible', preset === 'custom');
      });
      document.getElementById('cancel').addEventListener('click', function () { google.script.host.close(); });
      downloadButton.addEventListener('click', function () {
        status.className = 'status';
        status.textContent = '';
        const request = {
          preset: preset,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value
        };
        if (preset === 'custom' && (!request.startDate || !request.endDate)) {
          status.className = 'status error';
          status.textContent = 'Choose both a start and end date.';
          return;
        }
        downloadButton.disabled = true;
        downloadButton.innerHTML = '<span class="spinner"></span>Building your PDF...';
        google.script.run
          .withSuccessHandler(function (result) {
            const bytes = Uint8Array.from(atob(result.base64), function (char) { return char.charCodeAt(0); });
            const url = URL.createObjectURL(new Blob([bytes], { type: result.mimeType || 'application/pdf' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = result.filename || 'Yamzo-report.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            status.textContent = 'Downloaded ' + result.orderCount + ' orders (' + result.settledOrderCount + ' completed) and ' + result.costCount + ' cost records.';
            downloadButton.disabled = false;
            downloadButton.textContent = 'Generate & download PDF';
          })
          .withFailureHandler(function (error) {
            status.className = 'status error';
            status.textContent = (error && error.message) ? error.message : 'Report generation failed. Please try again.';
            downloadButton.disabled = false;
            downloadButton.textContent = 'Generate & download PDF';
          })
          .generateYamzoReportPdf(request);
      });
      google.script.run.withSuccessHandler(function (defaults) {
        document.getElementById('startDate').value = defaults.today;
        document.getElementById('endDate').value = defaults.today;
      }).getYamzoReportDefaults();
    </script>
  </body>
</html>
